---
# Build (optional) and deploy static files only — no nginx changes.
#
#   cd site/ansible && ansible-playbook deploy-files.yml
#   cd site/ansible && ansible-playbook deploy-files.yml -e skip_build=true
#
- name: Deploy recipe-scaler-bench static files
  hosts: server
  become: true
  vars:
    skip_build: false
  tasks:
    - name: Build site locally (prepare-images + astro build)
      when: not (skip_build | bool)
      command: npm run build
      args:
        chdir: "{{ playbook_dir }}/.."
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Check local dist exists
      stat:
        path: "{{ local_dist }}/index.html"
      delegate_to: localhost
      become: false
      run_once: true
      register: dist_index

    - name: Check local RSS feeds exist
      stat:
        path: "{{ local_dist }}/{{ item }}"
      loop:
        - rss.xml
        - en/rss.xml
      delegate_to: localhost
      become: false
      run_once: true
      register: dist_rss

    - name: Fail if dist is missing
      fail:
        msg: >-
          {{ local_dist }}/index.html not found.
          Run: cd site && npm run build
          or omit -e skip_build=true
      when: not dist_index.stat.exists
      delegate_to: localhost
      become: false
      run_once: true

    - name: Fail if local RSS feeds are missing
      fail:
        msg: >-
          Required RSS feeds are missing from {{ local_dist }}.
          Run: cd site && npm run build
          or omit -e skip_build=true
      when:
        - dist_index.stat.exists
        - dist_rss.results | selectattr('stat.exists', 'equalto', false) | list | length > 0
      delegate_to: localhost
      become: false
      run_once: true

    - name: Ensure deploy directory exists
      file:
        path: "{{ deploy_path }}"
        state: directory
        owner: "{{ deploy_owner }}"
        group: "{{ deploy_group }}"
        mode: "0755"

    - name: Sync dist to server
      synchronize:
        src: "{{ local_dist }}/"
        dest: "{{ deploy_path }}/"
        delete: true

    - name: Set ownership on deploy path
      file:
        path: "{{ deploy_path }}"
        owner: "{{ deploy_owner }}"
        group: "{{ deploy_group }}"
        recurse: true

    - name: Verify remote index.html
      stat:
        path: "{{ deploy_path }}/index.html"
      register: remote_index

    - name: Fail if remote index missing
      fail:
        msg: "Deploy failed: {{ deploy_path }}/index.html not found"
      when: not remote_index.stat.exists

    - name: Verify remote RSS feeds
      stat:
        path: "{{ deploy_path }}/{{ item }}"
      loop:
        - rss.xml
        - en/rss.xml
      register: remote_rss

    - name: Fail if remote RSS feeds are missing
      fail:
        msg: >-
          Deploy failed: required RSS feeds are missing from {{ deploy_path }}:
          {{ remote_rss.results | selectattr('stat.exists', 'equalto', false) | map(attribute='item') | join(', ') }}
      when: remote_rss.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

    - name: HTTP smoke check
      uri:
        url: "{{ public_url }}"
        method: GET
        status_code: [200, 301, 302, 404]
        validate_certs: true
        follow_redirects: none
      register: smoke
      failed_when: false
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: HTTP smoke check RSS (RU)
      uri:
        url: "{{ public_url }}rss.xml"
        method: GET
        status_code: [200, 301, 302, 404]
        validate_certs: true
        follow_redirects: none
      register: smoke_rss
      failed_when: false
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: HTTP smoke check RSS (EN)
      uri:
        url: "{{ public_url }}en/rss.xml"
        method: GET
        status_code: [200, 301, 302, 404]
        validate_certs: true
        follow_redirects: none
      register: smoke_en_rss
      failed_when: false
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Report deploy
      debug:
        msg: >-
          Files deployed to {{ deploy_path }}.
          URL: {{ public_url }}
          RSS: {{ public_url }}rss.xml and {{ public_url }}en/rss.xml.
          (HTTP probe statuses: site={{ smoke.status | default('n/a') }},
          rss={{ smoke_rss.status | default('n/a') }},
          en/rss={{ smoke_en_rss.status | default('n/a') }}).
