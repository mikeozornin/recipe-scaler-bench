---
# Deploy / update only nginx config for recipe-scaler-bench (no site files).
#
#   cd site/ansible && ansible-playbook update-nginx.yml
#
- name: Update nginx config for recipe-scaler-bench
  hosts: server
  become: true
  tasks:
    - name: Ensure nginx snippets directory exists
      file:
        path: /etc/nginx/snippets
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install recipe-scaler-bench location snippet
      template:
        src: recipe-scaler-bench.conf.j2
        dest: "{{ nginx_snippet_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Ensure main site includes the snippet
      blockinfile:
        path: "{{ nginx_site_config }}"
        marker: "# {mark} ANSIBLE MANAGED {{ nginx_include_marker }}"
        insertbefore: '^\s*location\s+/\s*\{'
        block: |
          include {{ nginx_snippet_path }};
        backup: true
      notify: Reload nginx

    - name: Test nginx configuration
      command: nginx -t
      changed_when: false

  handlers:
    - name: Reload nginx
      service:
        name: nginx
        state: reloaded

    - name: Display result
      listen: Reload nginx
      debug:
        msg: "Nginx reloaded. Config: {{ nginx_snippet_path }} → {{ public_url }}"
