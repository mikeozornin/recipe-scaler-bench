---
# Build the Astro site locally and rsync dist/ to the live document root.
# Does not touch nginx. Does not write to /var/www/recipe-scaler-bench/
# (that path belongs to a different vhost, bench.mikeozornin.ru).
- name: Deploy recipe-scaler-bench files
  hosts: web
  vars:
    site_dir: "{{ playbook_dir }}/../site"
    remote_root: /usr/share/nginx/html/recipe-scaler-bench
  tasks:
    - name: Install npm dependencies
      ansible.builtin.command: npm ci
      args:
        chdir: "{{ site_dir }}"
      delegate_to: localhost
      changed_when: false

    - name: Build static site
      ansible.builtin.command: npm run build
      args:
        chdir: "{{ site_dir }}"
      delegate_to: localhost
      changed_when: true

    - name: Confirm dist/index.html exists
      ansible.builtin.stat:
        path: "{{ site_dir }}/dist/index.html"
      delegate_to: localhost
      register: dist_index

    - name: Stop if the build did not produce index.html
      ansible.builtin.assert:
        that: dist_index.stat.exists
        fail_msg: "{{ site_dir }}/dist/index.html is missing. Build did not produce the site."

    - name: Rsync dist to the live nginx root
      ansible.posix.synchronize:
        src: "{{ site_dir }}/dist/"
        dest: "{{ remote_root }}/"
        delete: true
        rsync_opts:
          - "--chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"
