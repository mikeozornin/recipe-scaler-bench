---
# Install the location snippet and include it from the mikeozornin.ru server block.
# Safe to re-run: the snippet and the marked include are already on the server.
- name: Update nginx for recipe-scaler-bench
  hosts: web
  vars:
    nginx_site: /etc/nginx/sites-available/default
    nginx_snippet: /etc/nginx/snippets/recipe-scaler-bench.conf
  tasks:
    - name: Install the location snippet
      ansible.builtin.template:
        src: templates/recipe-scaler-bench.conf.j2
        dest: "{{ nginx_snippet }}"
        mode: "0644"
      notify: Reload nginx

    - name: Include the snippet from the mikeozornin.ru server block
      ansible.builtin.blockinfile:
        path: "{{ nginx_site }}"
        marker: "# {mark} ANSIBLE MANAGED recipe-scaler-bench-snippet"
        block: "include {{ nginx_snippet }};"
      notify: Reload nginx

  handlers:
    - name: Reload nginx
      ansible.builtin.shell: nginx -t && systemctl reload nginx
      args:
        executable: /bin/bash
